version: '3.8'

# Copy .env.example to .env and set real values before running in anything
# beyond local/dev use — the defaults below are dev-only placeholders.

services:
  prometheus:
    # NOTE: verify this is still the current stable Prometheus release at
    # deploy time rather than trusting this pin indefinitely.
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus
      - ./config/prometheus/metrics:/prometheus/metrics
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    # NOTE: verify this is still the current stable Grafana release at
    # deploy time rather than trusting this pin indefinitely.
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    restart: unless-stopped
    depends_on:
      - prometheus

  vault:
    # HashiCorp Vault relicensed to BUSL in 2023; OpenBao (Apache-2.0 fork,
    # https://openbao.org) is a drop-in alternative some open-source-preferring
    # DoD/gov shops adopt instead. Kept as Vault here since nothing in this
    # framework requires switching secrets-management engines.
    # NOTE: verify this is still a current, patched Vault 1.x release at
    # deploy time rather than trusting this pin indefinitely.
    image: hashicorp/vault:1.18.3
    container_name: vault
    ports:
      - "8200:8200"
    volumes:
      - ./config/vault:/vault/config
      - vault_data:/vault/file
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_API_ADDR=http://0.0.0.0:8200
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_DEV_ROOT_TOKEN_ID:-dev-only-token}
      - VAULT_TEST_USER_PASSWORD=${VAULT_TEST_USER_PASSWORD:-testpass123}
    cap_add:
      - IPC_LOCK
    command: sh -c "server -dev -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN_ID:-dev-only-token} & sleep 10 && /vault/config/init.sh"
    restart: unless-stopped

  # Sample metrics generator for testing
  sample-metrics:
    image: alpine:3.21
    container_name: sample-metrics
    volumes:
      - ./config/prometheus:/prometheus/config
      - ./config/prometheus/metrics:/prometheus/metrics
    entrypoint: /prometheus/config/sample-metrics.sh
    restart: unless-stopped
    depends_on:
      - prometheus

  # Node exporter for system metrics
  node-exporter:
    # NOTE: verify this is still the current stable node_exporter release at
    # deploy time rather than trusting this pin indefinitely.
    image: prom/node-exporter:v1.9.0
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  # Alertmanager for handling alerts
  alertmanager:
    # NOTE: verify this is still the current stable Alertmanager release at
    # deploy time rather than trusting this pin indefinitely.
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager:/etc/alertmanager
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  vault_data:
  alertmanager_data:
