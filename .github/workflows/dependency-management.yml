name: Dependency Management

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - '**/requirements.txt'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - '**/requirements.txt'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate
          npm audit fix --audit-level=moderate --force

      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'DoD Cybersecurity Framework'
          path: '.'
          format: 'HTML'
          args: >
            --suppression suppression.xml
            --failOnCVSS 7
            --enableExperimental

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install license-checker
        run: npm install -g license-checker

      - name: Check Licenses
        run: |
          license-checker --json --out license-report.json --excludePrivatePackages
          python .github/scripts/check_licenses.py license-report.json

      - name: Upload License Report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: license-report.json

  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Check for Updates
        id: ncu
        run: |
          npm install -g npm-check-updates
          ncu > updates.txt
          cat updates.txt

      - name: Create Update PR
        if: steps.ncu.outputs.exit_code == 1
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update dependencies'
          title: '⬆️ Update Dependencies'
          body: |
            Automated dependency updates.
            
            **Classification: UNCLASSIFIED // FOR OFFICIAL USE ONLY (FOUO)**
            
            Changes proposed in this PR:
            ```
            $(cat updates.txt)
            ```
            
            Security Impact:
            - [ ] Dependencies updated to latest secure versions
            - [ ] No breaking changes identified
            
            Compliance Impact:
            - [ ] All updates comply with approved licenses
            - [ ] No new compliance requirements introduced
          branch: deps/update
          labels: dependencies

  iron-bank-check:
    name: Iron Bank Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check Iron Bank Registry
        run: |
          python .github/scripts/check_iron_bank.py package.json

      - name: Generate Report
        run: |
          echo "Iron Bank Compliance Report" > iron-bank-report.md
          echo "=========================" >> iron-bank-report.md
          echo "" >> iron-bank-report.md
          python .github/scripts/generate_iron_bank_report.py >> iron-bank-report.md

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: iron-bank-report
          path: iron-bank-report.md

  dependency-graph:
    name: Generate Dependency Graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install madge
        run: npm install -g madge

      - name: Generate Dependency Graph
        run: |
          madge --image dependency-graph.svg .

      - name: Upload Graph
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: dependency-graph.svg

  notify-updates:
    name: Notify Dependency Updates
    needs: [security-audit, license-check, update-dependencies, iron-bank-check]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        uses: actions/github-script@v6
        with:
          script: |
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Dependency Check Failed',
              body: `Dependency checks failed in workflow ${context.workflow}
                     Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            }
            await github.rest.issues.create(issue)

permissions:
  contents: write
  pull-requests: write
  issues: write
  security-events: write
