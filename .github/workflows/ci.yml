name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 dashboard/src/utils/encryption.py dashboard/src/utils/logging.py
          flake8 dashboard/tests

      - name: Type check with mypy
        run: mypy dashboard/src/utils/encryption.py --config-file mypy.ini --follow-imports=skip

      - name: Run tests
        run: pytest
