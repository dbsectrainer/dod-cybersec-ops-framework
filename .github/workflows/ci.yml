name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            dashboard/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r dashboard/requirements-dev.txt

      - name: Syntax check
        run: python -m py_compile dashboard/src/app.py dashboard/src/auth/*.py dashboard/src/utils/*.py

      - name: Lint (ruff check)
        run: ruff check src/
        working-directory: dashboard

      - name: Format check (ruff format)
        run: ruff format --check src/
        working-directory: dashboard

      - name: Type check (mypy)
        run: mypy src/
        working-directory: dashboard

      - name: Test
        run: pytest tests/ -v
        working-directory: dashboard

  docker-build:
    name: Docker build & compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dashboard image
        run: docker build -t dod-cybersec-dashboard:ci .
        working-directory: dashboard

      - name: Validate docker-compose config
        run: |
          cp .env.example .env
          docker compose config
        working-directory: dashboard
